<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Wallpapers Gallery</title>
<meta name="description" content="Interactive live wallpapers that run right in your browser. Click one to view fullscreen.">
<style>
:root{--bg:#0b0d14;--card:#141824;--text:#e8ebf5;--muted:#8d94ab;--accent:#8b7bff}
@media (prefers-color-scheme: light){:root{--bg:#f4f5fa;--card:#fff;--text:#161a28;--muted:#5d647c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:48px 16px 16px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
header p{margin:0 auto;max-width:560px;color:var(--muted)}
.fb{display:inline-block;margin-top:16px;padding:10px 18px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;color:inherit;font:inherit;box-shadow:0 2px 14px #0003;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:2px solid var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;background:#0006;opacity:0;transition:opacity .2s;font-weight:600;color:#fff}
.card:hover .play,.card:focus-visible .play{opacity:1}
.info{padding:14px 16px 18px}
.info h2{margin:0 0 4px;font-size:18px}
.info p{margin:0;color:var(--muted);font-size:14px}
#viewer{position:fixed;inset:0;background:#000;display:none;z-index:10;overflow:hidden}
#viewer.open{display:block}
#viewer iframe{position:absolute;left:50%;top:50%;border:0;display:block;transform:translate(-50%,-50%)}
#viewer.rot iframe{transform:translate(-50%,-50%) rotate(90deg)}
.bar{position:absolute;z-index:2;top:12px;left:12px;right:12px;justify-content:space-between;display:flex;gap:8px;opacity:.85;transition:opacity .4s}
.bar.hide{opacity:0}
.bar button,.bar a{background:#000a;color:#fff;border:1px solid #fff4;border-radius:8px;padding:8px 12px;font:14px system-ui;cursor:pointer;text-decoration:none}
footer{text-align:center;color:var(--muted);padding:0 16px 40px;font-size:14px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Live Wallpapers</h1>
  <p>Animated wallpapers running live in your browser. Click one to preview it, then use the Fullscreen and Rotate buttons.</p>
  <a class="fb" id="fbTop" target="_blank" rel="noopener">Give feedback</a>
</header>
<main id="grid"></main>
<footer>Best on desktop Chrome/Edge. Some wallpapers are heavy — tell me if one lags. · <a id="fbFoot" target="_blank" rel="noopener">Leave feedback</a></footer>
<div id="viewer">
  <iframe id="frame" allow="fullscreen" title="Wallpaper"></iframe>
  <div class="bar" id="bar">
    <button id="close">← Back</button>
    <span style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <a id="fbView" target="_blank" rel="noopener">Feedback</a>
      <button id="rot">⟳ Rotate</button>
      <button id="fs">⛶ Fullscreen</button>
    </span>
  </div>
</div>
<script>
const REPO="iamrahul25/live-wallpaper";
const list=[
 {id:"koi-pond",thumb:"thumb.jpg"},
 {id:"hollow-king",thumb:"thumb.jpg"},
 {id:"neon-rain",thumb:"thumb.jpg"},
 {id:"icon-islands",thumb:"thumb.png"},
 {id:"particle-network",thumb:"thumb.png"},
 {id:"starfield",thumb:"thumb.png"}
];
const fbUrl=t=>`https://github.com/${REPO}/issues/new?title=${encodeURIComponent("Feedback: "+t)}&body=${encodeURIComponent("What I liked:\n\nWhat could be better:\n\nDevice / browser:\n")}`;
const $=id=>document.getElementById(id);
$("fbTop").href=$("fbFoot").href=fbUrl("Live Wallpapers");
const viewer=$("viewer"),frame=$("frame"),bar=$("bar");
let cur=null,timer;
function open(w){
  cur=w;frame.src=`wallpapers/${w.id}/index.html`;
  $("fbView").href=fbUrl(w.title);
  viewer.classList.add("open");document.body.style.overflow="hidden";
  history.replaceState(null,"","#"+w.id);
  setRot(false);
  wake();
}
function close(){
  viewer.classList.remove("open");frame.src="about:blank";document.body.style.overflow="";
  history.replaceState(null,"",location.pathname);
  if(document.fullscreenElement)document.exitFullscreen();
}
function fit(){
  const r=viewer.classList.contains("rot"),W=viewer.clientWidth,H=viewer.clientHeight;
  frame.style.width=(r?H:W)+"px";frame.style.height=(r?W:H)+"px";
}
function setRot(on){viewer.classList.toggle("rot",on);fit()}
$("rot").onclick=()=>setRot(!viewer.classList.contains("rot"));
addEventListener("resize",fit);
function wake(){bar.classList.remove("hide");clearTimeout(timer);timer=setTimeout(()=>bar.classList.add("hide"),2500)}
viewer.addEventListener("mousemove",wake);
$("close").onclick=close;
$("fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():viewer.requestFullscreen?.().catch(()=>alert("Fullscreen isn't supported here (on iPhone, use Rotate and Add to Home Screen)."));
document.addEventListener("fullscreenchange",()=>{$("fs").textContent=document.fullscreenElement?"⛶ Exit fullscreen":"⛶ Fullscreen";fit()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&viewer.classList.contains("open")&&!document.fullscreenElement)close();if(e.key==="r"&&viewer.classList.contains("open"))$("rot").click()});
Promise.all(list.map(async w=>{
  try{const m=await (await fetch(`wallpapers/${w.id}/wallpaper.json`)).json();return {...w,...m}}
  catch{return {...w,title:w.id,description:""}}
})).then(ws=>{
  const g=$("grid");
  ws.forEach(w=>{
    const b=document.createElement("button");b.className="card";
    b.innerHTML=`<div class="thumb"><img loading="lazy" alt=""><div class="play">▶ View fullscreen</div></div><div class="info"><h2></h2><p></p></div>`;
    b.querySelector("img").src=`wallpapers/${w.id}/${w.thumb}`;
    b.querySelector("h2").textContent=w.title;b.querySelector("p").textContent=w.description;
    b.onclick=()=>open(w);g.appendChild(b);
  });
  const h=location.hash.slice(1),f=ws.find(w=>w.id===h);if(f)open(f);
});
</script>
</body>
</html>
