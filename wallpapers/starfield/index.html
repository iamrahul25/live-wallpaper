<!doctype html>
<html><head><meta charset="utf-8"><title>Starfield</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
let w, h, stars = [];
const N = 900, speed = 0.0025;
function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
addEventListener("resize", resize); resize();
for (let i = 0; i < N; i++) stars.push({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() });
function frame() {
  x.fillStyle = "rgba(0,0,8,0.35)"; x.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, s = Math.max(w, h) / 2;
  for (const st of stars) {
    st.z -= speed;
    if (st.z <= 0.01) { st.x = Math.random() * 2 - 1; st.y = Math.random() * 2 - 1; st.z = 1; }
    const px = cx + (st.x / st.z) * s * 0.5, py = cy + (st.y / st.z) * s * 0.5;
    if (px < 0 || px > w || py < 0 || py > h) continue;
    const r = (1 - st.z) * 2.2, b = Math.floor((1 - st.z) * 255);
    x.fillStyle = `rgb(${b},${b},255)`;
    x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
