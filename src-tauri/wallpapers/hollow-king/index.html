<!doctype html>
<html><head><meta charset="utf-8"><title>The Hollow King</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
</style></head>
<body><canvas id="c"></canvas>
<script>
/*
 * The Hollow King: a crowned skull rendered as a living field of dithered pixel particles.
 * Raw WebGL2, no libraries, no image assets. Design brief: docs/briefs/hollow-king.md
 *
 * Pipeline
 *   bake     (on resize / pixel size / position only) raymarch the SDF scene at grid resolution
 *            into RGBA8: r = warm key light, g = cool fill + rim, b = eye glow, a = gem glow
 *   light    (per frame, grid res) flame flicker, eye pulse, haze around the subject
 *   embers   (per frame) points added into the light buffer, one cell each
 *   palette  (per frame, screen res) per cell: pick warm or cool ramp (dithered by warmth),
 *            Bayer 4x4 dither between ramp levels, 12 Hz "boil" re-rolls a slice of thresholds,
 *            glitch rows, stray accent pixels; every screen pixel of a cell gets the same colour
 *
 * Options: ?palette=0..4  ?px=1..4 (particle size at 1080p, scales with the screen)  ?boil=0..100
 *          ?embers=0  ?glitch=0  ?pos=right|centre|left  ?fps=30  ?q=low|medium|high|ultra (px 4/3/2/1)
 *          ?t=seconds  ?still
 * Host:    window.__lwSettings({ palette, pixel, boil, embers, glitch, position, fps, paused })
 * Lively:  livelyPropertyListener(name, value), livelyWallpaperPlaybackChanged(json)
 */
(() => {
"use strict";

const canvas = document.getElementById("c");
const params = new URLSearchParams(location.search);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const STILL = params.has("still");

const PALETTES = [
  { name: "Ember & Cobalt", cool: ["#000000", "#0b0a40", "#1c3c9c", "#2f6bd8", "#5c82c8"], warm: ["#000000", "#f2872c", "#e8a664", "#f5eec4", "#ffffff"], acc: "#4fb6a6", stray: "#d9587f" },
  { name: "Bone & Ash",     cool: ["#000000", "#121212", "#2e2d2a", "#55534c", "#7d7a70"], warm: ["#000000", "#a59a80", "#cfc4a6", "#efe8d2", "#ffffff"], acc: "#b9b19a", stray: "#8a8578" },
  { name: "Blood Moon",     cool: ["#000000", "#0c0a2c", "#1d2163", "#2f3d96", "#4f5fb4"], warm: ["#000000", "#c8182e", "#ff4d3d", "#ffb293", "#fff1e6"], acc: "#ff6f91", stray: "#7a8cff" },
  { name: "Witchfire",      cool: ["#000000", "#160a30", "#35186a", "#5b2db0", "#8a58dc"], warm: ["#000000", "#3ee86a", "#a2ff5c", "#e6ffc2", "#ffffff"], acc: "#38ffd0", stray: "#ff5cf0" },
  { name: "Frost",          cool: ["#000000", "#04122a", "#0c355a", "#1b6390", "#4a98c4"], warm: ["#000000", "#6fd8f2", "#aeeefc", "#e6fbff", "#ffffff"], acc: "#ffffff", stray: "#8ab4ff" },
];
const POS = ["right", "centre", "left"];
// particle size is in device pixels at 1080p and scales with the screen: 2 -> 2 px at FHD, 4 px at 4K
const QPX = { low: 4, medium: 3, high: 2, ultra: 1 };
const S = {
  palette: clamp(Math.round(+params.get("palette") || 0), 0, PALETTES.length - 1),
  px: clamp(Math.round(+params.get("px") || QPX[params.get("q")] || 2), 1, 4),
  boil: params.has("boil") ? clamp(+params.get("boil") / 100, 0, 1) : .6,
  embers: params.get("embers") !== "0",
  glitch: params.get("glitch") !== "0",
  pos: Math.max(0, POS.indexOf(params.get("pos") === "center" ? "centre" : params.get("pos"))),
  fps: clamp(+params.get("fps") || 30, 10, 240),
};

/* ======================================================================================
 * GLSL
 * ==================================================================================== */
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p*2. - 1., 0., 1.); }`;

const BAKE = `#version 300 es
precision highp float;
uniform vec2 uRes, uOff;
uniform float uYaw;
out vec4 o;
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float sdE(vec3 p, vec3 r){ float k0 = length(p/r), k1 = length(p/(r*r)); return k0*(k0 - 1.)/k1; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba)/dot(ba, ba), 0., 1.); return length(pa - ba*h) - r; }
float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b - a)/k, 0., 1.); return mix(b, a, h) - k*h*(1. - h); }
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float hash3(vec3 p){ p = fract(p*.3183099 + .1); p *= 17.; return fract(p.x*p.y*p.z*(p.x + p.y + p.z)); }
float noise3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3. - 2.*f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
vec3 toObj(vec3 p){ p.xz = rot(uYaw)*p.xz; return p; }

// a row of teeth around an arch centred at z = zc
float teeth(vec3 p, float y, float R, float zc, float h){
  float a = atan(p.x, p.z - zc), sec = .21;
  float id = clamp(floor(a/sec + .5), -5., 5.), ai = id*sec;
  float w = mix(.036, .05, smoothstep(1.5, 4., abs(id)));
  return sdE(p - vec3(sin(ai)*R, y, zc + cos(ai)*R), vec3(w, h, .042));
}

float bone(vec3 p){
  vec3 q = vec3(abs(p.x), p.y, p.z);
  float d = sdE(p - vec3(0., .42, -.22), vec3(.74, .78, .95));                       // braincase
  d = smin(d, sdE(p - vec3(0., .25, .25), vec3(.64, .62, .52)), .18);                 // forehead
  d = smin(d, sdE(p - vec3(0., -.05, -.30), vec3(.64, .45, .70)), .2);                // lower braincase, behind the cheeks
  d = smax(d, q.x - .78, .3);                                                         // slightly flatter temples
  d = smin(d, sdCap(q, vec3(.06, .01, .64), vec3(.44, .04, .48), .07), .08);          // brow ridge, overhanging
  d = smin(d, sdE(q - vec3(.40, -.29, .40), vec3(.14, .11, .17)), .08);               // cheekbones
  d = smin(d, sdCap(q, vec3(.48, -.28, .30), vec3(.60, -.25, -.10), .04), .1);        // zygomatic arch
  d = smin(d, sdE(p - vec3(0., -.35, .34), vec3(.33, .26, .30)), .12);                // upper jaw
  d = smax(d, -sdE(q - vec3(.24, -.135, .60), vec3(.165, .135, .46)), .05);           // eye sockets, deep and wider than tall
  d = smax(d, -sdE(q - vec3(.04, -.37, .66), vec3(.05, .11, .24)), .03);              // nose
  d = smax(d, -sdE(q - vec3(.36, -.52, .52), vec3(.12, .12, .1)), .06);               // sunken cheeks
  d = smax(d, -sdE(q - vec3(.60, -.50, .06), vec3(.12, .16, .26)), .08);              // under the arch
  d = min(d, teeth(p, -.65, .28, .17, .055));
  vec3 j = p + vec3(0., -.045, 0.), jq = vec3(abs(j.x), j.y, j.z);                   // lower jaw, shortened face
  float m = sdE(j - vec3(0., -1.0, .36), vec3(.20, .12, .13));
  m = smin(m, sdCap(jq, vec3(.10, -.94, .36), vec3(.40, -.86, .04), .08), .1);
  m = smin(m, sdCap(jq, vec3(.42, -.86, .03), vec3(.50, -.40, -.12), .06), .08);
  m = smin(m, sdE(j - vec3(0., -.87, .24), vec3(.28, .07, .22)), .06);
  m = min(m, teeth(j, -.79, .26, .15, .05));
  d = min(d, m);
  d = min(d, sdCap(p, vec3(0., -.6, -.42), vec3(0., -1.6, -.46), .13) - .03*sin(p.y*30.));   // neck
  return d;
}

vec2 crown(vec3 p){
  p -= vec3(0., .56, -.17);
  p.xy = rot(-.10)*p.xy;
  p.yz = rot(.05)*p.yz;
  vec2 xz = vec2(p.x, p.z*.84);
  float r = length(xz);
  float d = max(abs(r - .77) - .045, abs(p.y) - .14);                                 // band
  d = min(d, max(abs(r - .79) - .062, abs(abs(p.y) - .12) - .022));                    // rims
  float ang = atan(xz.x, xz.y), sec = 6.2831853/12.;
  float id = floor(ang/sec + .5), a = ang - id*sec;
  vec2 lc = vec2(r*sin(a), r*cos(a) - .78);
  float tall = mod(id, 2.) < .5 ? .44 : .26, py = p.y - .12;
  float tri = max(abs(lc.x) - .12*(1. - py/tall), max(-py, py - tall));
  d = min(d, max(tri, abs(lc.y) - .03)*.7);                                            // points
  d = min(d, length(vec3(lc.x, py - tall - .035, lc.y)) - .045);                      // finials
  float a2 = ang - (floor(ang/sec) + .5)*sec;
  float gem = sdE(vec3(r*sin(a2), p.y, r*cos(a2) - .815), vec3(.055, .065, .035));
  return gem < d ? vec2(gem, 3.) : vec2(d, 2.);
}

float mantle(vec3 p){
  float d = sdE(p - vec3(0., -2.45, -.35), vec3(2.05, .95, .95));                    // shoulders
  vec3 c = p - vec3(0., -1.42, -.34);
  float ruff = length(vec2(length(c.xz*vec2(1., 1.2)) - .56, c.y*1.15)) - .34;        // fur ruff around the neck
  d = smin(d, ruff, .4);
  float fur = smoothstep(-1.0, -1.5, p.y)*smoothstep(-2.4, -1.8, p.y);
  return d + .045*(noise3(p*5.) - .5) + (.035 + .07*fur)*(noise3(p*11.) - .5);        // fur
}

vec2 map(vec3 p){
  p = toObj(p);
  vec2 r = vec2(bone(p), 1.);
  vec2 c = crown(p); if (c.x < r.x) r = c;
  float m = mantle(p); if (m < r.x) r = vec2(m, 4.);
  vec3 md = p - vec3(0., -1.95, .56);                                                  // medallion
  float ring = length(vec2(length(md.xy) - .16, md.z)) - .035;
  if (ring < r.x) r = vec2(ring, 2.);
  float g = sdE(md, vec3(.09, .09, .05)); if (g < r.x) r = vec2(g, 3.);
  return r;
}
vec3 nor(vec3 p){
  const vec2 e = vec2(.0015, -.0015);
  return normalize(e.xyy*map(p + e.xyy).x + e.yyx*map(p + e.yyx).x + e.yxy*map(p + e.yxy).x + e.xxx*map(p + e.xxx).x);
}
float shadow(vec3 ro, vec3 rd){
  float r = 1., t = .03;
  for (int i = 0; i < 40; i++) { float h = map(ro + rd*t).x; r = min(r, 10.*h/t); t += clamp(h, .02, .25); if (r < .001 || t > 6.) break; }
  return clamp(r, 0., 1.);
}
float occl(vec3 p, vec3 n){
  float o = 0., s = 1.;
  for (int i = 1; i <= 5; i++) { float h = .02 + .05*float(i*i); o += (h - map(p + n*h).x)*s; s *= .7; }
  return clamp(1. - 1.6*o, 0., 1.);
}
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*uRes)/uRes.y - uOff;
  vec3 ro = vec3(0., -.55, 9.), rd = normalize(vec3(uv*.44, -1.));
  rd.yz = rot(.05)*rd.yz;
  float t = 5.5, mat = 0.; bool hit = false;
  for (int i = 0; i < 200; i++) {
    vec2 h = map(ro + rd*t);
    if (h.x < .0015) { hit = true; mat = h.y; break; }
    t += h.x*.8;
    if (t > 13.) break;
  }
  // embers deep in the eye sockets: glow along the ray, hidden when something is in front
  vec3 roO = toObj(ro), rdO = toObj(rd);
  float eg = 0.;
  for (int k = 0; k < 2; k++) {
    vec3 e = vec3(k == 0 ? .25 : -.25, -.13, .5);
    float tc = dot(e - roO, rdO), dm = length(roO + rdO*tc - e);
    eg += exp(-dm*dm*1100.)*.9*(hit ? smoothstep(-.3, -.05, t - tc) : 1.);
  }
  if (!hit) { o = vec4(0., 0., clamp(eg, 0., 1.), 0.); return; }
  vec3 p = ro + rd*t, n = nor(p), v = -rd, pO = toObj(p), nO = toObj(n);
  float occ = occl(p, n);
  vec3 L1 = normalize(vec3(.8, .75, .55)), L2 = normalize(vec3(-.7, .2, .7)), L3 = normalize(vec3(-.5, .45, -.75));
  float alb, spw = 16., spk = .15, wk = 1.;
  if (mat < 1.5) alb = .82 + .18*noise3(pO*16.);                                            // bone
  else if (mat < 2.5) { alb = .62 + .2*noise3(pO*30.); spw = 28.; spk = .9; }               // iron
  else if (mat < 3.5) { alb = .4; spk = 1.; spw = 40.; }                                    // gems
  else { alb = .34 + .4*noise3(pO*vec3(9., 22., 9.)); spk = .05; wk = .25; }                // fur: mostly in cool light
  float dif = max(dot(n, L1), 0.);
  float sh = dif > 0. ? shadow(p + n*.01, L1) : 0.;
  float spec = pow(max(dot(reflect(-L1, n), v), 0.), spw)*spk;
  float warm = (alb*dif*1.15*wk + spec)*sh*mix(.35, 1., occ);
  for (int k = 0; k < 2; k++) {                                                             // faint ember light in the sockets
    vec3 l = vec3(k == 0 ? .25 : -.25, -.13, .5) - pO; float dd = length(l);
    warm += alb*max(dot(nO, l/dd), 0.)*.05/(1. + dd*dd*90.);
  }
  float fill = max(dot(n, L2), 0.)*.5, fres = pow(1. - max(dot(n, v), 0.), 3.);
  float rim = fres*max(dot(n, L3) + .35, 0.)*1.1;
  float cool = (alb*(fill + .1) + rim*.8)*occ;
  float gem = mat > 2.5 && mat < 3.5 ? .65 + .35*dif : 0.;
  o = vec4(clamp(warm, 0., 1.), clamp(cool, 0., 1.), clamp(eg, 0., 1.), gem);
}`;

const LIGHT = `#version 300 es
precision highp float;
uniform sampler2D uBake;
uniform vec2 uRes;
uniform float uT, uFlame, uEye;
out vec4 o;
void main(){
  vec4 b = texelFetch(uBake, ivec2(gl_FragCoord.xy), 0);
  vec2 uv = gl_FragCoord.xy/uRes;
  float wav = sin(uv.y*7. + uT*2.3)*sin(uv.x*5. - uT*1.7);
  float W = b.r*uFlame*(.94 + .06*wav) + b.b*uEye;
  o = vec4(W, b.g, b.a, 1.);
}`;

const EMB_VS = `#version 300 es
in vec3 aP;
uniform vec2 uRes;
out float vB;
void main(){ vB = aP.z; gl_Position = vec4((floor(aP.xy) + .5)/uRes*2. - 1., 0., 1.); gl_PointSize = 1.; }`;
const EMB_FS = `#version 300 es
precision highp float;
in float vB;
out vec4 o;
void main(){ o = vec4(vB, vB*.08, 0., 0.); }`;

const PAL = `#version 300 es
precision highp float;
uniform sampler2D uLight;
uniform vec2 uGrid, uCenter;
uniform float uTick, uBoil;
uniform vec3 uCool[5], uWarm[5], uAcc, uStray;
uniform vec4 uGl[4];
out vec4 o;
const float BAY[16] = float[16](0., 8., 2., 10., 12., 4., 14., 6., 3., 11., 1., 9., 15., 7., 13., 5.);
float bayer(ivec2 p){ return (BAY[(p.x & 3) + ((p.y & 3) << 2)] + .5)/16.; }
float h21(vec2 p, float s){ vec3 p3 = fract(vec3(p.xyx)*.1031 + s*.1173); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec3 coolRamp(float v, float th){ v = clamp(v, 0., 1.)*4.; float i = floor(v); return uCool[min(int(i) + (v - i > th ? 1 : 0), 4)]; }
vec3 warmRamp(float v, float th){ v = clamp(v, 0., 1.)*4.; float i = floor(v); return uWarm[min(int(i) + (v - i > th ? 1 : 0), 4)]; }
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 L = texelFetch(uLight, c, 0);
  for (int i = 0; i < 4; i++) {                       // glitch rows: a dotted copy torn sideways
    vec4 g = uGl[i];
    if (g.w > 0. && float(c.y) >= g.x && float(c.y) < g.x + g.y) {
      vec4 s = texelFetch(uLight, ivec2(clamp(c.x + int(g.z), 0, int(uGrid.x) - 1), c.y), 0);
      L = (c.x & 1) == 0 ? max(L*.35, s) : L*.35;
    }
  }
  vec2 cf = vec2(c);
  float th = bayer(c), th2 = bayer(c + ivec2(2, 1));
  float flip = step(h21(cf + 17.3, uTick), uBoil*.4);            // the boil: a slice of cells re-roll
  th = mix(th, h21(cf, uTick), flip);
  th2 = mix(th2, h21(cf + 5.7, uTick), flip);
  float W = L.r, C = L.g;
  vec3 col = (W/(W + C + 1e-3) > th2 && W > .015) ? warmRamp(pow(W, .85), th) : coolRamp(pow(C, .8), th);
  if (L.b > th) col = L.b > .85 ? uWarm[3] : uAcc;
  if (max(W, C) > .06 && h21(cf + 3.1, uTick*1.37) < .004) col = h21(cf + 9.2, uTick) < .5 ? uAcc : uStray;
  if (W + C < .01) {                                   // dust: sparse, random, twinkling around the subject
    vec2 dd = (cf/uGrid - uCenter)*vec2(uGrid.x/uGrid.y, 1.);
    if (h21(cf + 11.7, floor(uTick/3.)) < .014*exp(-dot(dd, dd)*3.)) col = uCool[1];
  }
  o = vec4(col, 1.);
}`;

/* ======================================================================================
 * GL setup
 * ==================================================================================== */
let gl, P = {}, vao, embVao, embBuf, bakeTex, bakeFb, lightTex, lightFb, palTex, palFb, lost = false;
let Wd = 0, Hd = 0, cell = 2, gw = 0, gh = 0, needBake = true, bakeStrip = 0, bakeStrips = 0;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs, attribs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  (attribs || []).forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const name = gl.getActiveUniform(p, i).name;
    u[name.replace(/\[0\]$/, "")] = gl.getUniformLocation(p, name);
  }
  return { p, u };
}
function makeTarget(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return [t, f];
}

function init() {
  gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: STILL, powerPreference: "low-power" });
  if (!gl) throw new Error("WebGL2 unavailable");
  P.bake = program(VS, BAKE);
  P.light = program(VS, LIGHT);
  P.emb = program(EMB_VS, EMB_FS, ["aP"]);
  P.pal = program(VS, PAL);
  vao = gl.createVertexArray();
  embVao = gl.createVertexArray();
  gl.bindVertexArray(embVao);
  embBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, embBuf);
  gl.bufferData(gl.ARRAY_BUFFER, embData.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  Wd = Hd = 0;
  resize(true);
}

function resize(force) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(16, Math.round(innerWidth * dpr)), h = Math.max(16, Math.round(innerHeight * dpr));
  // one particle = S.px device pixels on a 1080-line screen, scaled up with the real resolution,
  // so FHD and 4K show the same density (about 540 rows) instead of 4K getting 4x the detail cost
  const c = Math.max(1, Math.round(S.px * Math.max(1, h / 1080)));
  if (!force && w === Wd && h === Hd && c === cell) return;
  Wd = w; Hd = h; cell = c;
  canvas.width = Wd; canvas.height = Hd;
  const nw = Math.ceil(Wd / cell), nh = Math.ceil(Hd / cell);
  if (nw !== gw || nh !== gh || !bakeTex) {
    gw = nw; gh = nh;
    for (const t of [bakeTex, lightTex, palTex]) if (t) gl.deleteTexture(t);
    for (const f of [bakeFb, lightFb, palFb]) if (f) gl.deleteFramebuffer(f);
    [bakeTex, bakeFb] = makeTarget(gw, gh);
    [lightTex, lightFb] = makeTarget(gw, gh);
    [palTex, palFb] = makeTarget(gw, gh);
    needBake = true;
    resetEmbers();
  }
}

/* ======================================================================================
 * Composition
 * ==================================================================================== */
function subject() {
  const aspect = gw / gh, wide = aspect > 1.2;
  const x = !wide ? .5 : [.64, .5, .36][S.pos];
  const yaw = !wide || S.pos === 1 ? -.16 : S.pos === 0 ? -.26 : .26;
  return { x, y: .57, yaw, aspect };
}

// Raymarched once per size, in horizontal strips so no single draw can trip the GPU watchdog.
// Spread over frames (top strip first): the king materialises in well under a second instead of
// one long stall, which matters at 4K or the finest particle size.
function startBake() {
  bakeStrips = Math.max(4, Math.ceil(gw * gh / 2.5e4));
  bakeStrip = 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, bakeFb);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  needBake = false;
}
function bakeSome(max) {
  if (bakeStrip >= bakeStrips) return;
  const s = subject();
  gl.bindFramebuffer(gl.FRAMEBUFFER, bakeFb);
  gl.viewport(0, 0, gw, gh);
  gl.useProgram(P.bake.p);
  gl.uniform2f(P.bake.u.uRes, gw, gh);
  gl.uniform2f(P.bake.u.uOff, (s.x - .5) * s.aspect, s.y - .5);
  gl.uniform1f(P.bake.u.uYaw, s.yaw);
  gl.bindVertexArray(vao);
  gl.enable(gl.SCISSOR_TEST);
  for (let k = 0; k < max && bakeStrip < bakeStrips; k++, bakeStrip++) {
    const i = bakeStrips - 1 - bakeStrip;
    const y0 = Math.floor(gh * i / bakeStrips), y1 = Math.floor(gh * (i + 1) / bakeStrips);
    gl.scissor(0, y0, gw, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.flush();
  }
  gl.disable(gl.SCISSOR_TEST);
}

/* ======================================================================================
 * Simulation: flame, embers, glitch rows
 * ==================================================================================== */
let seed = 1;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rand();
let time = +params.get("t") || 0, flame = 1, eye = .8;

const MAXE = 200, embers = [], embData = new Float32Array(MAXE * 3);
const emberTarget = () => (S.embers ? clamp(Math.round(70 * gh / 540), 40, MAXE) : 0);   // same look at any particle size
function spawnEmber(anywhere) {
  const s = subject();
  const life = rr(3.5, 8);
  embers.push({
    x: s.x * gw + rr(-.42, .42) * gh, y: anywhere ? rr(.02, .9) * gh : rr(-.02, .3) * gh,
    vx: rr(-.012, .006) * gh, vy: rr(.018, .055) * gh, ph: rr(0, 6.28), b: rr(.35, 1),
    life: anywhere ? rr(0, life) : 0, max: life,
  });
}
function resetEmbers() { embers.length = 0; seed = 7; for (let i = 0, n = emberTarget(); i < n; i++) spawnEmber(true); }

const glRows = [], glData = new Float32Array(16);
let glNext = 3;

function step(dt) {
  time += dt;
  // flame: two slow noises, the occasional gutter
  flame = .9 + .06 * Math.sin(time * 1.7) * Math.sin(time * .63 + 1) + .04 * Math.sin(time * 5.3 + Math.sin(time * 1.1) * 3);
  eye = .72 + .2 * Math.sin(time * 1.25) + .08 * Math.sin(time * 3.7);
  const target = emberTarget();
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.life += dt;
    e.x += (e.vx + Math.sin(time * 1.3 + e.ph) * .006 * gh) * dt;
    e.y += e.vy * dt;
    if (e.life > e.max || e.y > gh + 2) embers.splice(i, 1);
  }
  while (embers.length < target) spawnEmber(false);
  if (embers.length > target) embers.length = target;
  glNext -= dt;
  if (S.glitch && glNext <= 0 && !STILL) {
    glNext = rr(4, 10);
    for (let i = 0, n = 1 + Math.floor(rand() * 3); i < n; i++) {
      glRows.push({ y: Math.floor(rr(.15, .9) * gh), h: rand() < .3 ? 2 : 1, off: Math.round(rr(.012, .06) * gw * (rand() < .8 ? 1 : -1)), until: time + rr(.17, .34) });
    }
  }
  for (let i = glRows.length - 1; i >= 0; i--) if (glRows[i].until < time || !S.glitch) glRows.splice(i, 1);
}

/* ======================================================================================
 * Render
 * ==================================================================================== */
const hex3 = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const flat = (list) => new Float32Array(list.flatMap(hex3));

function render() {
  if (needBake) startBake();
  bakeSome(STILL ? Infinity : 2);
  const s = subject();
  // light buffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, lightFb);
  gl.viewport(0, 0, gw, gh);
  gl.useProgram(P.light.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bakeTex);
  gl.uniform1i(P.light.u.uBake, 0);
  gl.uniform2f(P.light.u.uRes, gw, gh);
  gl.uniform1f(P.light.u.uT, time);
  gl.uniform1f(P.light.u.uFlame, flame);
  gl.uniform1f(P.light.u.uEye, eye);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // embers, one cell each, added to the warm channel
  if (embers.length) {
    let n = 0;
    for (const e of embers) {
      const k = e.life / e.max, fl = .75 + .25 * Math.sin(time * 9 + e.ph * 5);
      embData[n++] = e.x; embData[n++] = e.y; embData[n++] = e.b * Math.sin(Math.PI * k) * fl;
    }
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(P.emb.p);
    gl.uniform2f(P.emb.u.uRes, gw, gh);
    gl.bindVertexArray(embVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, embBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, embData, 0, n);
    gl.drawArrays(gl.POINTS, 0, n / 3);
    gl.disable(gl.BLEND);
  }
  // palette + dither, one fragment per particle
  gl.bindFramebuffer(gl.FRAMEBUFFER, palFb);
  gl.viewport(0, 0, gw, gh);
  const pal = PALETTES[S.palette], u = P.pal.u;
  gl.useProgram(P.pal.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, lightTex);
  gl.uniform1i(u.uLight, 0);
  gl.uniform2f(u.uGrid, gw, gh);
  gl.uniform2f(u.uCenter, s.x, s.y);
  gl.uniform1f(u.uTick, Math.floor(time * 12) % 9973);
  gl.uniform1f(u.uBoil, S.boil);
  gl.uniform3fv(u.uCool, flat(pal.cool));
  gl.uniform3fv(u.uWarm, flat(pal.warm));
  gl.uniform3fv(u.uAcc, hex3(pal.acc));
  gl.uniform3fv(u.uStray, hex3(pal.stray));
  glData.fill(0);
  glRows.slice(0, 4).forEach((g, i) => glData.set([g.y, g.h, g.off, 1], i * 4));
  gl.uniform4fv(u.uGl, glData);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // nearest-neighbour upscale: every particle becomes a crisp cell x cell square on screen
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, palFb);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  gl.blitFramebuffer(0, 0, gw, gh, 0, Hd - gh * cell, gw * cell, Hd, gl.COLOR_BUFFER_BIT, gl.NEAREST);
}

/* ======================================================================================
 * Frame loop, pausing, host hooks
 * ==================================================================================== */
let running = true, raf = 0, last = 0, onBattery = false;
const stats = { n: 0, t0: 0, fps: 0 };
window.__lwStats = () => ({ fps: Math.round(stats.fps), grid: [gw, gh], cell, palette: PALETTES[S.palette].name, embers: embers.length });
function targetFps() { return onBattery ? Math.min(S.fps, 30) : S.fps; }
function frame(ts) {
  raf = 0;
  if (!running || lost) return;
  raf = requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const target = 1000 / targetFps(), gap = last ? ts - last : target;
  if (last && gap < target - 1.5) return;
  last = ts;
  step(Math.min(.1, gap / 1000));
  render();
  stats.n++;
  if (ts - stats.t0 >= 1000) { stats.fps = stats.n * 1000 / (ts - stats.t0); stats.n = 0; stats.t0 = ts; }
}
function setPaused(p) { running = !p; last = 0; if (running && !raf && !STILL) raf = requestAnimationFrame(frame); }
function setPixel(v) { v = clamp(Math.round(+v), 1, 4); if (v === S.px) return; S.px = v; resize(true); }
function setPosition(v) { v = typeof v === "string" ? Math.max(0, POS.indexOf(v)) : clamp(Math.round(+v), 0, 2); if (v === S.pos) return; S.pos = v; needBake = true; resetEmbers(); }

function fail(e) {
  console.error("The Hollow King:", e);
  canvas.style.display = "none";
  document.body.style.background = "radial-gradient(ellipse at 64% 40%, #2f6bd8 0, #0b0a40 22%, #000 48%)";
}
canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); lost = true; });
canvas.addEventListener("webglcontextrestored", () => { lost = false; bakeTex = null; gw = gh = 0; try { init(); setPaused(!running); } catch (e) { fail(e); } });
document.addEventListener("visibilitychange", () => { last = 0; });
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); if (STILL) render(); });
});
if (navigator.getBattery) navigator.getBattery().then((b) => { const u = () => { onBattery = !b.charging; }; b.addEventListener("chargingchange", u); u(); }).catch(() => {});

window.__lwSettings = (o) => {
  if (!o) return;
  if (o.palette != null) S.palette = clamp(Math.round(+o.palette), 0, PALETTES.length - 1);
  if (o.pixel != null) setPixel(o.pixel);
  if (o.boil != null) S.boil = clamp(+o.boil / 100, 0, 1);
  if ("embers" in o) S.embers = !!o.embers;
  if ("glitch" in o) S.glitch = !!o.glitch;
  if (o.position != null) setPosition(o.position);
  if (o.fps) S.fps = clamp(+o.fps, 10, 240);
  if (o.paused != null) setPaused(!!o.paused);
  if (STILL) render();
};
window.livelyPropertyListener = (name, val) => {
  if (name === "palette") S.palette = clamp(Math.round(+val), 0, PALETTES.length - 1);
  else if (name === "pixel") setPixel(val);
  else if (name === "boil") S.boil = clamp(+val / 100, 0, 1);
  else if (name === "embers") S.embers = !!val;
  else if (name === "glitch") S.glitch = !!val;
  else if (name === "position") setPosition(val);
  else if (name === "fps") S.fps = clamp(+val, 10, 240);
};
window.livelyWallpaperPlaybackChanged = (data) => {
  try { const o = typeof data === "string" ? JSON.parse(data) : data; setPaused(!!o.IsPaused); } catch (e) { /* ignore */ }
};

try {
  init();
  if (STILL) {
    const t0 = time || 6;
    time = 0;
    for (let i = 0, n = Math.round(t0 * 30); i < n; i++) step(1 / 30);
    render();
  } else {
    raf = requestAnimationFrame(frame);
  }
} catch (e) { fail(e); }
})();
</script></body></html>
