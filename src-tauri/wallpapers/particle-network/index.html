<!doctype html>
<html><head><meta charset="utf-8"><title>Particle Network</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#1b1f3a,#07080f);overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
let w, h, pts = [];
const mouse = { x: -1e4, y: -1e4 };
function resize() {
  w = c.width = innerWidth; h = c.height = innerHeight;
  const n = Math.min(160, Math.floor((w * h) / 14000));
  pts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4 }));
}
addEventListener("resize", resize); resize();
addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
const LINK = 130;
function frame() {
  x.clearRect(0, 0, w, h);
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > w) p.vx *= -1;
    if (p.y < 0 || p.y > h) p.vy *= -1;
  }
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    for (let j = i + 1; j < pts.length; j++) {
      const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
      if (d < LINK) {
        x.strokeStyle = `rgba(130,160,255,${(1 - d / LINK) * 0.5})`;
        x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
      }
    }
    const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
    if (md < 180) { x.strokeStyle = `rgba(255,140,200,${1 - md / 180})`; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(mouse.x, mouse.y); x.stroke(); }
    x.fillStyle = "#c7d2ff"; x.beginPath(); x.arc(a.x, a.y, 1.8, 0, 6.283); x.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
