<!doctype html>
<html><head><meta charset="utf-8"><title>Minimal Clock</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;color:#fff}
body{display:grid;place-items:center;background:linear-gradient(120deg,#ff9a76,#ff6b9a,#6a5cff,#4cc9f0);background-size:400% 400%;animation:bg 40s ease infinite}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wrap{text-align:center;text-shadow:0 4px 30px #0004}
#time{font-size:17vmin;font-weight:200;letter-spacing:-.02em;line-height:1}
#date{font-size:3.4vmin;font-weight:400;opacity:.9;margin-top:1.5vmin;letter-spacing:.2em;text-transform:uppercase}
</style></head>
<body><div class="wrap"><div id="time"></div><div id="date"></div></div>
<script>
const t = document.getElementById("time"), d = document.getElementById("date");
function tick() {
  const n = new Date();
  t.textContent = n.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  d.textContent = n.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
}
tick(); setInterval(tick, 1000);
</script></body></html>
