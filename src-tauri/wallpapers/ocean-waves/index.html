<!doctype html>
<html><head><meta charset="utf-8"><title>Ocean Waves</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#0b1d3a,#123a63 55%,#1d5f8a)}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
let w, h;
function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
addEventListener("resize", resize); resize();
const layers = [
  { amp: 26, len: 0.004, spd: 0.6, y: 0.55, col: "rgba(76,201,240,0.25)" },
  { amp: 34, len: 0.003, spd: 0.4, y: 0.63, col: "rgba(56,160,220,0.35)" },
  { amp: 42, len: 0.0024, spd: 0.3, y: 0.72, col: "rgba(30,110,180,0.55)" },
  { amp: 50, len: 0.0018, spd: 0.22, y: 0.82, col: "rgba(12,60,120,0.85)" },
];
function frame(t) {
  t /= 1000;
  x.clearRect(0, 0, w, h);
  // moon glow
  const g = x.createRadialGradient(w * .75, h * .22, 0, w * .75, h * .22, h * .3);
  g.addColorStop(0, "rgba(255,245,220,.9)"); g.addColorStop(.12, "rgba(255,245,220,.25)"); g.addColorStop(1, "transparent");
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (const L of layers) {
    x.beginPath(); x.moveTo(0, h);
    for (let px = 0; px <= w; px += 8) {
      const py = h * L.y + Math.sin(px * L.len + t * L.spd) * L.amp + Math.sin(px * L.len * 2.3 - t * L.spd * 1.7) * L.amp * .35;
      x.lineTo(px, py);
    }
    x.lineTo(w, h); x.closePath(); x.fillStyle = L.col; x.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
