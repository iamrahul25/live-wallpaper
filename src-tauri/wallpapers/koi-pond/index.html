<!doctype html>
<html><head><meta charset="utf-8"><title>Koi Pond</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#062a2b}
canvas{display:block;width:100vw;height:100vh}
</style></head>
<body><canvas id="c"></canvas>
<script>
/*
 * Koi Pond: a sunlit Japanese garden pond seen from above. Raw WebGL2, no libraries, no image assets.
 *
 * Frame pipeline
 *   bed     (once per resize) rocks, pebbles, silt and water plants baked into 3 textures
 *   ripple  height-field wave equation; koi, drips and bubbles push it
 *   caustic analytic wind waves + ripples -> refraction slopes and caustics (from the surface Hessian)
 *   shadow  koi, lily pads and lotus cast soft shadows on the pond floor
 *   koi     deformable meshes, shaded in the fragment shader, tinted by their depth
 *   final   refraction, plants, caustics, water volume, sky reflection, sun glints, rocks
 *   overlay lily pads, lotus (+ shadows and reflections), fallen petals, pollen and duckweed
 *
 * Options: ?q=low|medium|high|ultra  ?fps=60  ?fish=8  ?t=seconds  ?still (render one settled frame)
 * Host:    window.__lwSettings({ quality, fps, fish, lotus, calm, paused }), window.__lwIcons(snapshot)
 * Lively:  livelyPropertyListener(name, value), livelyWallpaperPlaybackChanged(json)
 */
(() => {
"use strict";

const canvas = document.getElementById("c");
const params = new URLSearchParams(location.search);
const PRESETS = {
  low:    { px: 1.0e6, bed: 1.3e6, cs: .42, sh: .40, sim: 200, fps: 30 },
  medium: { px: 2.1e6, bed: 2.1e6, cs: .50, sh: .50, sim: 280, fps: 60 },
  high:   { px: 3.7e6, bed: 3.7e6, cs: .55, sh: .50, sim: 340, fps: 60 },
  ultra:  { px: 9.0e6, bed: 6.0e6, cs: .60, sh: .50, sim: 420, fps: 60 },
};
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const S = {
  quality: PRESETS[params.get("q")] ? params.get("q") : "high",
  fps: +params.get("fps") || 0,                    // 0 = the preset's rate
  fish: clamp(Math.round(+params.get("fish") || 8), 1, 14),
  lotus: true,
  calm: true,                                       // keep the left side calm for desktop icons
};
const STILL = params.has("still");

/* ======================================================================================
 * GLSL
 * ==================================================================================== */
const COMMON = `
precision highp float;
precision highp int;
precision highp sampler2D;
uniform float uA, uTime, uSunI, uCalm;
uniform vec2 uRes;
#define WL .56
#define KD .55
#define CAMH 1.6
#define PI 3.14159265
const vec3 LSUN  = vec3(.300, -.340, .891);
const vec3 SUNC  = vec3(1., .92, .78);
const vec3 SIG   = vec3(10.5, 3.1, 3.6);
const vec3 WATER = vec3(.0050, .046, .043);
const vec3 AMB   = vec3(.24, .31, .31);
float ss(float a, float b, float x){ float t = clamp((x - a)/(b - a), 0., 1.); return t*t*(3. - 2.*t); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p, int oct){ float s = 0., a = .5, n = 0.;
  for (int i = 0; i < 7; i++){ if (i >= oct) break; s += a*vnoise(p); n += a; p = mat2(1.6, 1.2, -1.2, 1.6)*p + 3.7; a *= .5; }
  return s/n; }
float wob(float t, float s){ return sin(t*1.7 + s)*.5 + sin(t*4.3 + s*2.1)*.3 + sin(t*9.1 + s*3.7)*.2; }
// > 0 inside the rocky margin (right edge, and the right part of the top and bottom edges)
float shoreBand(vec2 p){
  float r = p.x - (uA - (.105 + .035*wob(p.y*3., 1.) + .06*ss(.35, 0., p.y) + .07*ss(.62, 1., p.y)));
  float rt = ss(uA*.5, uA*.78, p.x), rb = ss(uA*.42, uA*.72, p.x);
  float t = (.055 + .03*wob(p.x*2.5, 4.))*rt - p.y - .1*(1. - rt);
  float b = p.y - (1. - (.06 + .03*wob(p.x*2.2, 7.))*rb) - .1*(1. - rb);
  return max(r, max(t, b));
}
// a maple on the left bank shades that side of the pond (keeps it calm behind the icons)
float canopyCover(vec2 p){ return ss(.64, .06, p.x + .10*sin(p.y*2.6 + .8) - .07*ss(.45, 0., p.y)); }
vec2 toUV(vec2 p){ return vec2(p.x/uA, 1. - p.y); }
vec2 toWorld(vec2 uv){ return vec2(uv.x*uA, 1. - uv.y); }
vec4 toClip(vec2 p){ return vec4(p.x/uA*2. - 1., 1. - 2.*p.y, 0., 1.); }
vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
vec3 sq(vec3 c){ return c*c; }
#ifdef LDR
#define ENC_C(v) ((v)*.25)
#define DEC_C(v) ((v)*4.)
#define ENC_S(v) vec4((v).xy*4. + .5, (v).z*.25 + .5, (v).w)
#define DEC_S(v) vec4(((v).xy - .5)*.25, ((v).z - .5)*4., (v).w)
#else
#define ENC_C(v) (v)
#define DEC_C(v) (v)
#define ENC_S(v) (v)
#define DEC_S(v) (v)
#endif
vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
vec3 grade(vec3 c, vec2 p, vec2 fc){
  float lc = uCalm*(1. - ss(.10, .72, p.x));            // calmer, darker, softer on the left
  float l = dot(c, vec3(.2126, .7152, .0722));
  c = mix(c, vec3(l), .18*lc)*(1. - .22*lc);
  c = aces(c*1.6);
  vec2 q = fc/uRes - .5;
  c *= 1. - .34*dot(q, q);
  c = pow(c, vec3(1./2.2));
  return c + (hash12(fc + fract(uTime*.37)*97.) - .5)/255.;
}
`;

const VS_FULL = `void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p*2. - 1., 0., 1.); }`;

/* ---------- pond floor, rocks and plants (baked once) ---------- */
const FS_BED = `
layout(location = 0) out vec4 o0;   // rgb: sqrt(colour) (dry rock pre-lit, wet = albedo), a: terrain height
layout(location = 1) out vec4 o1;   // water plants: rgb sqrt(colour), a coverage
layout(location = 2) out vec4 o2;   // r shore proximity, g direct-sun factor, b plant tip, a ambient occlusion
const float KH = .10;

vec4 rockLayer(vec2 p, float cell, float pBase, float hLo, float hHi, float seed){
  vec2 ip = floor(p/cell);
  vec4 best = vec4(0.);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = ip + vec2(i, j);
    vec2 h = hash22(c + seed);
    vec2 cp = (c + .2 + .6*h)*cell;
    float sb = shoreBand(cp);
    if (hash12(c + seed + 7.1) > clamp(pBase + sb*14., 0., .97)) continue;
    float R = cell*(.52 + .28*hash12(c + seed + 3.1));
    vec2 d = p - cp + (vec2(vnoise(p*26. + seed), vnoise(p*26. + seed + 9.)) - .5)*cell*.20;
    float a = atan(d.y, d.x);
    float rr = R*(1. + .14*sin(a*2. + h.x*6.28) + .08*sin(a*3. + h.y*6.28) + .05*sin(a*5. + h.x*17.));
    float t = length(d)/rr;
    if (t >= 1.) continue;
    float top = mix(hLo, hHi, clamp(sb*8. + .5, 0., 1.))*(.82 + .18*hash12(c + seed + 5.3));
    float dm = sqrt(1. - t*t);
    float hg = top*pow(dm, .5);
    if (hg > best.x) best = vec4(hg, hash12(c + seed + 11.), dm, 1.);
  }
  return best;
}
float floorH(vec2 p){
  float h = .10 + .33*ss(-.32, .03, shoreBand(p));
  h += .06*(fbm(p*2.4 + 4., 4) - .5);
  return h - .05*ss(.55*uA, 0., p.x);
}
// x height, y material (0 floor, 1 rock), z rock id, w dome; peb = pebble (height, id, dome)
vec4 terrain(vec2 p, out vec3 peb){
  float f = floorH(p);
  peb = vec3(0.);
  float sh = ss(.30, .45, f);
  if (sh > 0.){
    vec2 ip = floor(p/.017);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
      vec2 c = ip + vec2(i, j);
      if (hash12(c + 33.) > .78*sh) continue;
      vec2 h = hash22(c + 31.);
      vec2 cp = (c + .25 + .5*h)*.017;
      float R = .017*(.30 + .26*hash12(c + 35.));
      float an = h.y*6.28; vec2 d = p - cp; d = mat2(cos(an), sin(an), -sin(an), cos(an))*d; d.y *= 1.3 + .4*h.x;
      float t = length(d)/R;
      if (t < 1.){ float dm = sqrt(1. - t*t); float hg = .022*dm; if (hg > peb.x) peb = vec3(hg, hash12(c + 37.), dm); }
    }
  }
  vec4 res = vec4(f + peb.x, 0., 0., 0.);
  vec4 r1 = rockLayer(p, .12, .28, .50, 1.0, 0.);
  vec4 r2 = rockLayer(p, .052, .05, .44, .80, 17.);
  float rough = fbm(p*40., 3) - .5;
  if (r2.w > 0.){ float h2 = r2.x + rough*.035*r2.z; if (h2 > res.x) res = vec4(h2, 1., r2.y, r2.z); }
  if (r1.w > 0.){ float h1 = r1.x + rough*.040*r1.z; if (h1 > res.x) res = vec4(h1, 1., r1.y, r1.z); }
  return res;
}
float rocksOnly(vec2 p){ return max(rockLayer(p, .12, .28, .50, 1., 0.).x, rockLayer(p, .052, .05, .44, .80, 17.).x); }

vec3 rockCol(vec2 p, float id, float h, vec3 n){
  vec3 c = mix(vec3(.36, .35, .33), vec3(.56, .54, .50), id);
  c = mix(c, vec3(.50, .44, .37), ss(.55, .9, fract(id*7.31))*.6);
  c *= .78 + .44*fbm(p*150. + id*20., 3);
  c *= .88 + .2*fbm(p*40. + id*3., 3);
  float cr = abs(fbm(p*24. + id*9., 4) - .5);
  c *= .74 + .26*ss(.0, .045, cr);
  float mossN = fbm(p*13. + id*5., 5);
  float moss = ss(.57, .74, mossN + .14*n.z - .22*dot(n.xy, normalize(LSUN.xy)))*ss(WL + .02, WL + .10, h);
  vec3 mc = mix(vec3(.17, .23, .09), vec3(.30, .35, .15), fbm(p*55., 3));
  c = mix(c, mc, moss*.75);
  float li = ss(.70, .76, fbm(p*28. + 3.3 + id, 3));
  c = mix(c, vec3(.66, .66, .52), li*.45*(1. - moss));
  c *= 1. - .42*ss(WL + .07, WL + .005, h);              // wet band just above the waterline
  if (h < WL) c = mix(c, vec3(.20, .22, .11), .5)*.85;   // algae below it
  return c;
}
vec3 floorCol(vec2 p, float f, vec3 peb){
  float sh = ss(.22, .44, f);
  float n = fbm(p*8., 5);
  vec3 silt = mix(vec3(.16, .16, .10), vec3(.25, .23, .15), n);
  vec3 sand = mix(vec3(.44, .40, .30), vec3(.56, .51, .39), fbm(p*34., 3));
  vec3 c = mix(silt, sand, ss(.15, .85, sh + (n - .5)*.5));
  c *= .86 + .28*vnoise(p*180.);
  c = mix(c, vec3(.22, .14, .07), ss(.74, .80, fbm(p*15. + 9., 3))*.45);   // sunken leaves
  if (peb.x > 0.){
    vec3 pc = mix(vec3(.42, .41, .38), vec3(.56, .45, .32), ss(.3, .7, peb.y));
    pc = mix(pc, vec3(.24, .23, .22), ss(.8, .95, peb.y));
    pc = mix(pc, vec3(.55, .36, .28), ss(.12, 0., peb.y));
    c = mix(c, pc*(.8 + .25*peb.z), ss(.0, .25, peb.z));
  }
  return c;
}
// spider-like water weed: fine strands radiating from each clump
vec4 plants(vec2 p, out float tip){
  tip = 0.;
  vec4 acc = vec4(0.);
  const float cell = .13;
  vec2 ip = floor(p/cell);
  float px = 1.5/uRes.y;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 c = ip + vec2(i, j);
    vec2 h = hash22(c + 41.);
    vec2 cp = (c + .2 + .6*h)*cell;
    float sb = shoreBand(cp);
    float pr = .10 + .55*ss(-.34, -.14, sb)*ss(-.02, -.08, sb);
    if (hash12(c + 43.) > pr) continue;
    float R = cell*(.42 + .40*hash12(c + 44.));
    vec2 d = p - cp; float r = length(d);
    if (r > R) continue;
    float a = atan(d.y, d.x);
    float N = 7. + floor(hash12(c + 45.)*6.);
    float bend = (hash12(c + 46.) - .5)*1.8;
    for (int k = 0; k < 13; k++){
      float fk = float(k);
      if (fk >= N) break;
      float hk = hash12(c + fk*1.37 + 50.);
      float len = R*(.5 + .5*hk);
      if (r > len) continue;
      float tt = r/len;
      float th = fk/N*6.2832 + hk*.6 + bend*tt*tt + .2*sin(tt*6. + hk*7.);
      float da = abs(mod(a - th + PI, 2.*PI) - PI);
      float w = max(.0055*(1. - tt*.65)*(.35 + .65*abs(sin(tt*24. + hk*9.))), .0011);
      float cov = ss(w + px, w - px*.5, da*r)*.92;
      vec3 col = mix(vec3(.06, .15, .05), vec3(.22, .38, .10), tt*(.6 + .5*hk));
      acc.rgb = mix(acc.rgb, col, cov);
      acc.a = max(acc.a, cov);
      tip = max(tip, tt*cov);
    }
  }
  return acc;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes, p = toWorld(uv);
  vec3 peb, pb2;
  vec4 T = terrain(p, peb);
  float e = 1.2/uRes.y;
  float hx = terrain(p + vec2(e, 0.), pb2).x, hy = terrain(p + vec2(0., e), pb2).x;
  vec3 n = normalize(vec3(-(hx - T.x)*KH/e, -(hy - T.x)*KH/e, 1.));
  float h = T.x;
  // soft shadows from the rocks: march toward the sun through the height field
  vec2 dir = normalize(LSUN.xy);
  float slope = LSUN.z/length(LSUN.xy), vis = 1.;
  for (int i = 1; i <= 12; i++){
    float t = float(i)*.0045;
    float hq = rocksOnly(p + dir*t);
    vis = min(vis, clamp(1. + (h*KH + t*slope - hq*KH)/(.006 + t*.12), 0., 1.));
  }
  float ndl = max(dot(n, LSUN), 0.);
  bool rock = T.y > .5;
  vec3 c = lin(rock ? rockCol(p, T.z, h, n) : floorCol(p, h, peb));
  float ao = rock ? mix(.55, 1., ss(.0, .5, T.w)) : 1.;
  if (h > WL) c *= vec3(.30, .34, .40)*ao + SUNC*1.15*ndl*vis;
  o0 = vec4(sqrt(clamp(c, 0., 1.)), h);
  float tip;
  vec4 pl = plants(p, tip);
  pl.a *= ss(.025, .06, WL - h)*(rock ? .25 : 1.);
  o1 = vec4(sqrt(pl.rgb/max(pl.a, .001)), pl.a);
  o2 = vec4(ss(-.25, .0, shoreBand(p)), clamp(ndl*vis/LSUN.z/1.5, 0., 1.), tip, ao);
}
`;

/* ---------- ripple simulation ---------- */
const FS_SIM = `
uniform sampler2D uPrev, uBed;
uniform vec4 uSrc[24];
uniform int uNSrc;
uniform float uDamp;
out vec4 o;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy), mx = ivec2(uRes) - 1;
  #define HT(dx, dy) texelFetch(uPrev, clamp(ip + ivec2(dx, dy), ivec2(0), mx), 0).r
  vec2 c = texelFetch(uPrev, ip, 0).rg;
  float lap = (4.*(HT(1, 0) + HT(-1, 0) + HT(0, 1) + HT(0, -1)) + HT(1, 1) + HT(-1, 1) + HT(1, -1) + HT(-1, -1) - 20.*c.r)/6.;
  float nh = (2.*c.r - c.g + .48*lap)*uDamp;
  vec2 uv = gl_FragCoord.xy/uRes, pw = toWorld(uv);
  for (int i = 0; i < 24; i++){
    if (i >= uNSrc) break;
    vec4 s = uSrc[i];
    vec2 d = pw - s.xy;
    nh += s.w*exp(-dot(d, d)/(s.z*s.z));
  }
  nh *= ss(WL + .012, WL - .004, texture(uBed, uv).a);            // stone banks reflect
  float edge = min(min(uv.x, 1. - uv.x), min(uv.y, 1. - uv.y));  // the pond goes on past the screen
  nh *= mix(.93, 1., ss(0., .035, edge));
  o = vec4(clamp(nh, -4., 4.), c.r, 0., 1.);
}
`;

/* ---------- surface slopes + caustics ---------- */
const FS_CAUS = `
uniform sampler2D uSim, uBed;
uniform vec2 uSimTex;
uniform float uRip, uCK;
layout(location = 0) out vec4 oC;   // rgb caustics on the floor, a: softer caustics near the surface (for koi)
layout(location = 1) out vec4 oS;   // xy surface slope, z ripple height, w sunlight mask
void waves(vec2 p, float t, out vec2 g, out vec3 hs){
  g = vec2(0.); hs = vec3(0.);
  float gust = .55 + .65*vnoise(p*1.3 + vec2(t*.05, -t*.035));
  for (int i = 0; i < 14; i++){
    float fi = float(i);
    float ang = fi*2.39996 + .4;
    vec2 d = vec2(cos(ang), sin(ang));
    float lam = .028*pow(1.17, fi);
    float k = 6.2832/lam;
    float ph = dot(d, p)*k - k*(.010 + .11*lam)*t + fi*1.7;
    const float sl = .020;
    g += d*(sl*cos(ph));
    hs += (-sl*k*sin(ph))*vec3(d.x*d.x, d.y*d.y, d.x*d.y);
  }
  g *= gust; hs *= gust;
}
float caus(vec3 hs, float F, float eps){
  float a = 1. + F*hs.x, b = 1. + F*hs.y, c = F*hs.z;
  float det = a*b - c*c;
  return 1./sqrt(det*det + eps);
}
float sunMask(vec2 p, float t){
  float cover = canopyCover(p);
  float l = 1.;
  if (cover > .002){
    vec2 sw = vec2(sin(t*.31)*.007 + sin(t*.83 + 1.3)*.0025, cos(t*.27)*.006 + sin(t*.71)*.002);
    float n = fbm((p + sw)*5.2 + 2., 5)*.62 + fbm((p + sw*1.8)*12. + 7., 3)*.38;
    l = mix(1., mix(.18, .95, ss(.55, .64, n)), cover);
  }
  l *= 1. - .10*ss(.45, .75, fbm(p*.7 + vec2(t*.008, t*.005), 3));   // slow, thin cloud shadows
  return l*uSunI;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uRes, p = toWorld(uv);
  float D = max(WL - texture(uBed, uv).a, 0.)*KD;
  vec2 g; vec3 hs;
  waves(p, uTime, g, hs);
  float calm = mix(.6, 1., ss(.05, .85, p.x));
  g *= calm; hs *= calm;
  vec2 e = uSimTex;
  float h0 = texture(uSim, uv).r;
  float hxp = texture(uSim, uv + vec2(e.x, 0.)).r, hxm = texture(uSim, uv - vec2(e.x, 0.)).r;
  float hyp = texture(uSim, uv + vec2(0., e.y)).r, hym = texture(uSim, uv - vec2(0., e.y)).r;
  float hpp = texture(uSim, uv + e).r, hmm = texture(uSim, uv - e).r;
  float hpm = texture(uSim, uv + vec2(e.x, -e.y)).r, hmp = texture(uSim, uv + vec2(-e.x, e.y)).r;
  float dx = e.x*uA, dy = e.y;
  g  += uRip*vec2((hxp - hxm)/(2.*dx), -(hyp - hym)/(2.*dy));
  hs += uRip*vec3((hxp - 2.*h0 + hxm)/(dx*dx), (hyp - 2.*h0 + hym)/(dy*dy), -(hpp - hpm - hmp + hmm)/(4.*dx*dy));
  float F = min(D, .2)*uCK;
  float eps = .02 + D*D*4.;
  vec3 I = vec3(caus(hs, F*1.05, eps), caus(hs, F, eps), caus(hs, F*.95, eps));
  I = pow(I, vec3(1.15))*.82;
  float Is = caus(hs, F*.32 + .015*uCK, .03);
  float m = sunMask(p, uTime);
  oC = ENC_C(vec4(I*m, Is*m));
  oS = ENC_S(vec4(g, h0, m));
}
`;

/* ---------- koi ---------- */
const VS_FISH = `
in vec2 aPos; in vec2 aUV; in vec2 aLat;
uniform int uMode;            // 0 colour, 1 shadow on the floor
uniform sampler2D uBed;
uniform vec2 uFishC;
uniform float uZ, uL;
out vec2 vUV; out vec2 vLat; out float vSoft; out float vDark;
void main(){
  vec2 off = vec2(0.);
  vSoft = 0.; vDark = 0.;
  if (uMode == 1){
    float D = max((WL - texture(uBed, toUV(uFishC)).a)*KD, uZ + .012);
    float hab = D - uZ;                              // height above the floor
    off = -LSUN.xy/LSUN.z*hab;
    vSoft = (.004 + hab*.065)/uL;
    vDark = .70*(1. - .4*ss(0., .22, hab));
  }
  vUV = aUV; vLat = aLat;
  gl_Position = toClip(aPos + off);
}
`;
const FISH_SHAPE = `
uniform float uPhase, uAmp, uFinL, uFinR, uPel, uSpread, uFlut;
float bodyW(float u){
  float t = clamp(u/.84, 0., 1.);
  return max(.205*pow(t, .42)*pow(1. - t, .62), .021*ss(.60, .72, u)*ss(.905, .84, u));
}
float smax(float a, float b, float k){ float h = max(k - abs(a - b), 0.)/k; return max(a, b) + h*h*k*.25; }
float finFan(vec2 q, vec2 b, float phi, float l, float wd, float aa, out float ray){

    if (f.sipDone && (f.sipHold -= dt) <= 0) { f.sipping = false; f.depthT = .2 + .25 * rnd(); f.sipT = 30 + rnd() * 60; }
  }
  // depth: glide up and down smoothly; slip deeper when passing behind desktop icons
  let depthT = f.depthT;
  if (iconDanger(f.x, f.y) > .3 && !f.sipping) depthT = Math.max(depthT, .8);
  f.vz += (clamp((depthT - f.z01) * .6, -.12, .12) - f.vz) * Math.min(1, dt * 1.5);
  f.z01 = clamp(f.z01 + f.vz * dt, 0, 1);
  f.z = f.z01 * Math.min(ZMAX, floorDepth(f.x, f.y) * .85);

  // ---- steering
  const ch = Math.cos(f.h), sh = Math.sin(f.h);
  const t = time;
  let turn = (noise1(f.seed * 7.1 + t * f.wf) + .35 * noise1(f.seed * 3.3 + t * f.wf * 2.7)) * f.wt;
  const look = L * .9 + f.speed * 1.1;
  const dC = danger(f.x + ch * look, f.y + sh * look);
  if (dC > .001) {
    const dL = danger(f.x + Math.cos(f.h - .7) * look, f.y + Math.sin(f.h - .7) * look);
    const dR = danger(f.x + Math.cos(f.h + .7) * look, f.y + Math.sin(f.h + .7) * look);
    turn += (dL <= dR ? -1 : 1) * (.6 + 2.2 * Math.min(dC, 1.5));
  }
  const d0 = danger(f.x, f.y);
  if (d0 > .05) {
    const e = .02;
    const gx = danger(f.x + e, f.y) - danger(f.x - e, f.y), gy = danger(f.x, f.y + e) - danger(f.x, f.y - e);
    const away = (Math.abs(gx) + Math.abs(gy) > 1e-6) ? Math.atan2(-gy, -gx) : Math.atan2(.5 - f.y, A * .6 - f.x);
    turn += clamp(angDiff(away, f.h), -1.2, 1.2) * 1.4 * Math.min(d0, 1.5);
  }
  for (const g of fish) {
    if (g === f || Math.abs(g.z01 - f.z01) > .3) continue;
    const dx = g.x - f.x, dy = g.y - f.y, dist = Math.hypot(dx, dy), R = (f.L + g.L) * .45;
    if (dist < R && dist > 1e-5) turn -= Math.sign(ch * dy - sh * dx) * (1 - dist / R) * 1.6;
  }
  let target;
  if (f.mode === "follow" && f.leader) {
    const g = f.leader, bx = g.x - Math.cos(g.h) * g.L * 1.3, by = g.y - Math.sin(g.h) * g.L * 1.3;
    turn += clamp(angDiff(Math.atan2(by - f.y, bx - f.x), f.h), -1, 1) * .9;
    target = clamp(g.speed / L * (Math.hypot(bx - f.x, by - f.y) > L ? 1.15 : .95), .2, .9) * L;
  } else target = (f.mode === "cruise" ? f.cruise : f.mode === "slow" ? .16 : f.mode === "burst" ? 1.5 : 0) * L;
  if (f.sipping && !f.sipDone) target = Math.min(target || .2 * L, .25 * L);
  const maxTurn = .25 + 1.6 * f.speed / L;
  turn = clamp(turn, -maxTurn, maxTurn);
  f.tv += (turn - f.tv) * Math.min(1, dt * 1.8);
  f.h += f.tv * dt;

  // ---- speed and stroke
  const gliding = f.mode === "glide";
  target *= 1 - .25 * Math.min(1, Math.abs(f.tv) / maxTurn);
  if (gliding) f.speed += (.07 * L - f.speed) * .35 * dt;
  else { const err = target - f.speed; f.speed += err * (err > 0 ? 1.1 : .45) * dt; }
  f.speed = Math.max(f.speed, .06 * L);
  const err = target - f.speed;
  const effort = gliding ? 0 : clamp(.3 + Math.max(0, err) / (.4 * L) + Math.abs(f.tv) * .35, 0, 1.3);
  f.amp += ((gliding ? .012 : .03 + .075 * effort) - f.amp) * Math.min(1, dt * 2.5);
  f.freq += (.55 + 1.5 * f.speed / L + effort * .4 - f.freq) * Math.min(1, dt * 2);
  f.phase += 2 * Math.PI * f.freq * dt;
  // pectoral fins: spread when slow or braking, tucked when fast, scull while hovering
  const sp = clamp(f.speed / (.9 * L), 0, 1);
  let base = 1.25 - .85 * sp;
  if (gliding) base = Math.max(base, .95);
  const tk = clamp(f.tv / 1.5, -1, 1), scull = (1 - sp) * .16;
  f.finPh += dt * (2.2 + 2 * (1 - sp));
  const k = Math.min(1, dt * 4);
  f.finR += (clamp(base + tk * .35 + scull * Math.sin(f.finPh), .3, 1.7) - f.finR) * k;
  f.finL += (clamp(base - tk * .35 + scull * Math.sin(f.finPh + Math.PI), .3, 1.7) - f.finL) * k;
  f.pel += (.55 + .35 * (1 - sp) - f.pel) * k;
  f.flut += dt * (4 + 3 * sp);

  f.x += Math.cos(f.h) * f.speed * dt;
  f.y += Math.sin(f.h) * f.speed * dt;
  const lx = f.trX[f.trHead], ly = f.trY[f.trHead];
  if (Math.hypot(f.x - lx, f.y - ly) > L * .012) {
    f.trHead = (f.trHead + 1) % TR;
    f.trX[f.trHead] = f.x; f.trY[f.trHead] = f.y;
    f.trN = Math.min(TR, f.trN + 1);
  }
}

// spine: sample the swum path by arc length (so the body follows its own turns), then add the stroke wave
function buildFish(f, off) {
  const L = f.L, sx = f.sx, sy = f.sy, ch = Math.cos(f.h), sh = Math.sin(f.h);
  let ax = f.x, ay = f.y, acc = 0, j = 0, dirx = -ch, diry = -sh;
  for (let k = 0; k < NS; k++) {
    const d = UA[k] * L;
    if (d <= 0) { sx[k] = f.x - ch * d; sy[k] = f.y - sh * d; continue; }
    for (;;) {
      if (j >= f.trN) { sx[k] = ax + dirx * (d - acc); sy[k] = ay + diry * (d - acc); break; }
      const idx = (f.trHead - j + TR) % TR, bx = f.trX[idx], by = f.trY[idx];
      const seg = Math.hypot(bx - ax, by - ay);
      if (seg > 1e-7 && acc + seg >= d) { const q = (d - acc) / seg; sx[k] = ax + (bx - ax) * q; sy[k] = ay + (by - ay) * q; break; }
      if (seg > 1e-7) { acc += seg; dirx = (bx - ax) / seg; diry = (by - ay) / seg; }
      ax = bx; ay = by; j++;
    }
  }
  for (let k = 0; k < NS; k++) {
    const a = Math.max(0, k - 1), b = Math.min(NS - 1, k + 1);
    let fx = sx[a] - sx[b], fy = sy[a] - sy[b];
    const n = Math.hypot(fx, fy) || 1; fx /= n; fy /= n;
    const u = UA[k], env = .10 + .9 * u * u;
    const o = f.amp * env * Math.sin(f.phase - WAVEK * u) * L;
    TMPX[k] = sx[k] - fy * o; TMPY[k] = sy[k] + fx * o;
  }
  const sd = PERSP / (PERSP + f.z), cx = A * .5, cy = .5;
  let p = off;
  for (let k = 0; k < NS; k++) {
    const a = Math.max(0, k - 1), b = Math.min(NS - 1, k + 1);
    let fx = TMPX[a] - TMPX[b], fy = TMPY[a] - TMPY[b];
    const n = Math.hypot(fx, fy) || 1; fx /= n; fy /= n;
    const lx = -fy, ly = fx, hw = HW[k] * L * sd;
    const px = cx + (TMPX[k] - cx) * sd, py = cy + (TMPY[k] - cy) * sd;
    sx[k] = px; sy[k] = py;
    fishData[p++] = px - lx * hw; fishData[p++] = py - ly * hw; fishData[p++] = UA[k]; fishData[p++] = -HW[k]; fishData[p++] = lx; fishData[p++] = ly;
    fishData[p++] = px + lx * hw; fishData[p++] = py + ly * hw; fishData[p++] = UA[k]; fishData[p++] = HW[k]; fishData[p++] = lx; fishData[p++] = ly;
  }
  f.cx = sx[NS >> 1]; f.cy = sy[NS >> 1]; f.Ls = L * sd;
}
const TMPX = new Float32Array(NS), TMPY = new Float32Array(NS);

/* ---------- ripple sources, bubbles ---------- */
let events = [], bubbles = [];
const SRC = new Float32Array(24 * 4);
let nSrc = 0;
function addSrc(x, y, r, w) { if (nSrc >= 24) return; SRC.set([x, y, r, w], nSrc * 4); nSrc++; }
function spawnBubbles(x, y, n, z0) {
  for (let i = 0; i < n && bubbles.length < 40; i++)
    bubbles.push({ x: x + (rnd() - .5) * .01, y: y + (rnd() - .5) * .01, z: z0 + i * .12, vz: .12 + .06 * rnd(), ph: rnd() * 6, s: .7 + .5 * rnd() });
}
const BUB = new Float32Array(40 * 4);
let dropT = 3, bubbleT = 5;

/* ======================================================================================
 * Simulation step + rendering
 * ==================================================================================== */
let time = +params.get("t") || 0, simAcc = 0;
function simRate() { return 60 * simH / 340; }

function step(dt) {
  time += dt;
  sunI = .95 + .03 * Math.sin(time * .031 + 1) + .025 * Math.sin(time * .017 + 4);
  for (const f of fish) updateFish(f, dt);
  // ambient life: a drip or an insect touching the water, a few bubbles from the floor
  if ((dropT -= dt) <= 0) {
    dropT = 4 + rnd() * 7;
    for (let k = 0; k < 10; k++) {
      const x = A * (.42 + .5 * rnd()), y = .08 + .84 * rnd();
      if (shoreBand(x, y) < -.03) { events.push({ x, y, r: .0045, w: -.035, n: 2 }); break; }
    }
  }
  if ((bubbleT -= dt) <= 0) {
    bubbleT = 7 + rnd() * 9;
    const x = A * (.45 + .45 * rnd()), y = .1 + .8 * rnd();
    if (shoreBand(x, y) < -.04) spawnBubbles(x, y, 3 + (rnd() * 3 | 0), 1);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.z -= b.vz * dt;
    b.x += Math.sin(time * 3 + b.ph) * .002 * dt;
    if (b.z <= 0) { events.push({ x: b.x, y: b.y, r: .0035, w: -.02 * b.s, n: 2 }); bubbles.splice(i, 1); }
  }
  // ripple simulation at a fixed rate
  simAcc += dt * simRate();
  let n = Math.min(6, Math.floor(simAcc));
  simAcc -= Math.floor(simAcc);
  for (const f of fish) buildFish(f, 0);   // updates spine points for the sources below
  const perStep = 60 / simRate();
  for (let s = 0; s < n; s++) {
    nSrc = 0;
    for (const f of fish) {
      if (f.z > .075) continue;
      const k = 1 - f.z / .075, k2 = k * k;
      addSrc(f.sx[5], f.sy[5], .010 + f.L * .07, -.0010 * k2 * (.35 + f.speed / f.L) * perStep);
      const tk = NS - 5;
      addSrc(f.sx[tk], f.sy[tk], .010 + f.L * .06, .00045 * k2 * Math.sin(f.phase) * (f.amp / .07) * perStep);
    }
    for (let i = events.length - 1; i >= 0; i--) {
      const e = events[i];
      addSrc(e.x, e.y, e.r, e.w);
      if (--e.n <= 0) events.splice(i, 1);
    }
    simPass();
  }
}

function simPass() {
  const p = P.sim;
  gl.bindFramebuffer(gl.FRAMEBUFFER, T["simF" + (1 - simI)]);
  gl.viewport(0, 0, simW, simH);
  use(p, simW, simH);
  tex(p, "uPrev", 0, T["sim" + simI]);
  tex(p, "uBed", 1, T.bedA);
  gl.uniform4fv(p.u.uSrc, SRC);
  I1(p, "uNSrc", nSrc);
  F1(p, "uDamp", Math.pow(.5, 1 / (simRate() * .9)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  simI = 1 - simI;
}

function fishUniforms(p, f) {
  F1(p, "uL", f.Ls); F1(p, "uSeed", f.seed); F1(p, "uVar", f.v);
  F1(p, "uDepth", clamp(f.z / ZMAX, 0, 1)); F1(p, "uZ", f.z);
  F1(p, "uPhase", f.phase); F1(p, "uAmp", f.amp); F1(p, "uFinL", f.finL); F1(p, "uFinR", f.finR);
  F1(p, "uPel", f.pel); F1(p, "uSpread", .9 + .12 * Math.cos(f.phase * 2)); F1(p, "uFlut", f.flut);
  F2(p, "uFishC", f.cx, f.cy);
}

function render() {
  // koi geometry for this frame
  for (let i = 0; i < fish.length; i++) buildFish(fish[i], i * NS * 12);
  gl.bindBuffer(gl.ARRAY_BUFFER, B.fish);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, fishData, 0, fish.length * NS * 12);

  // 1. surface slopes + caustics
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.causF);
  gl.viewport(0, 0, cW, cH);
  let p = P.caus;
  use(p, cW, cH);
  tex(p, "uSim", 0, T["sim" + simI]);
  tex(p, "uBed", 1, T.bedA);
  F2(p, "uSimTex", 1 / simW, 1 / simH);
  F1(p, "uRip", .06);
  F1(p, "uCK", 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2. shadows on the pond floor
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.shadowF);
  gl.viewport(0, 0, sW, sH);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendEquation(gl.MAX); gl.blendFunc(gl.ONE, gl.ONE);
  p = P.fish; use(p, sW, sH);
  tex(p, "uBed", 0, T.bedA); tex(p, "uCaus", 1, T.caus); tex(p, "uSurf", 2, T.surf);
  I1(p, "uMode", 1);
  gl.bindVertexArray(B.fishVAO);
  for (let i = 0; i < fish.length; i++) { fishUniforms(p, fish[i]); gl.drawArrays(gl.TRIANGLE_STRIP, i * NS * 2, NS * 2); }
  p = P.pad; use(p, sW, sH);
  tex(p, "uSurf", 0, T.surf); tex(p, "uBed", 1, T.bedA); I1(p, "uMode", 1);
  gl.bindVertexArray(B.padVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, pads.length);
  if (S.lotus && lotus.length) {
    p = P.lotus; use(p, sW, sH);
    tex(p, "uSurf", 0, T.surf); tex(p, "uBed", 1, T.bedA); I1(p, "uMode", 4);
    gl.bindVertexArray(B.lotusVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, lotus.length);
  }
  gl.blendEquation(gl.FUNC_ADD);

  // 3. koi layer (premultiplied), deepest first
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.fishF);
  gl.viewport(0, 0, W, H);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const px = H / 1080;
  p = P.pts; use(p, W, H);
  tex(p, "uSurf", 0, T.surf); I1(p, "uMode", 1); F1(p, "uPx", px);
  gl.bindVertexArray(B.motesVAO); gl.drawArrays(gl.POINTS, 0, motes.length);
  p = P.fish; use(p, W, H);
  tex(p, "uBed", 0, T.bedA); tex(p, "uCaus", 1, T.caus); tex(p, "uSurf", 2, T.surf);
  I1(p, "uMode", 0);
  gl.bindVertexArray(B.fishVAO);
  order.sort((a, b) => b.z - a.z);
  for (const f of order) { fishUniforms(p, f); gl.drawArrays(gl.TRIANGLE_STRIP, fish.indexOf(f) * NS * 2, NS * 2); }
  if (bubbles.length) {
    const cx = A * .5;
    bubbles.forEach((b, i) => {
      const z = clamp(b.z, 0, 1), sd = PERSP / (PERSP + z * ZMAX);
      BUB.set([cx + (b.x - cx) * sd, .5 + (b.y - .5) * sd, (1.6 + 3.6 * (1 - z)) * b.s * px, z], i * 4);
    });
    gl.bindBuffer(gl.ARRAY_BUFFER, B.bubbles); gl.bufferSubData(gl.ARRAY_BUFFER, 0, BUB, 0, bubbles.length * 4);
    p = P.pts; use(p, W, H);
    tex(p, "uSurf", 0, T.surf); I1(p, "uMode", 2); F1(p, "uPx", 1);
    gl.bindVertexArray(B.bubblesVAO); gl.drawArrays(gl.POINTS, 0, bubbles.length);
  }
  gl.disable(gl.BLEND);

  // 4. composite to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  p = P.comp; use(p, W, H);
  tex(p, "uBedA", 0, T.bedA); tex(p, "uVeg", 1, T.veg); tex(p, "uInfo", 2, T.info);
  tex(p, "uCaus", 3, T.caus); tex(p, "uSurf", 4, T.surf); tex(p, "uShadow", 5, T.shadow); tex(p, "uFish", 6, T.fish);
  gl.bindVertexArray(null);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 5. things floating on the surface
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  if (S.lotus && lotus.length) {
    p = P.lotus; use(p, W, H);
    tex(p, "uSurf", 0, T.surf); tex(p, "uBed", 1, T.bedA); I1(p, "uMode", 2);
    gl.bindVertexArray(B.lotusVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, lotus.length);
  }
  p = P.pts; use(p, W, H);
  tex(p, "uSurf", 0, T.surf); I1(p, "uMode", 0); F1(p, "uPx", px);
  gl.bindVertexArray(B.specksVAO); gl.drawArrays(gl.POINTS, 0, specks.length);
  p = P.pad; use(p, W, H);
  tex(p, "uSurf", 0, T.surf); tex(p, "uBed", 1, T.bedA); I1(p, "uMode", 0);
  gl.bindVertexArray(B.padVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, pads.length);
  p = P.lotus; use(p, W, H);
  tex(p, "uSurf", 0, T.surf); tex(p, "uBed", 1, T.bedA);
  I1(p, "uMode", 3);
  gl.bindVertexArray(B.petalVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, petals.length);
  if (S.lotus && lotus.length) {
    gl.bindVertexArray(B.lotusVAO);
    I1(p, "uMode", 1); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, lotus.length);
    I1(p, "uMode", 0); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, lotus.length);
  }
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
}

/* ======================================================================================
 * Setup, sizing, bed bake
 * ==================================================================================== */
function vao(setup) { const v = gl.createVertexArray(); gl.bindVertexArray(v); setup(); gl.bindVertexArray(null); return v; }
function attr(buf, loc, size, stride, offset, divisor = 0) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
  gl.vertexAttribDivisor(loc, divisor);
}

function init() {
  gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: STILL });
  if (!gl) throw new Error("WebGL2 unavailable");
  HDR = !!gl.getExtension("EXT_color_buffer_float");
  T = {}; bedKey = "";
  P.bed = program(VS_FULL, FS_BED);
  P.sim = program(VS_FULL, FS_SIM);
  P.caus = program(VS_FULL, FS_CAUS);
  P.comp = program(VS_FULL, FS_COMP);
  P.fish = program(VS_FISH, FS_FISH, ["aPos", "aUV", "aLat"]);
  P.pad = program(VS_PAD, FS_PAD, ["aCorner", "aP", "aQ"]);
  P.lotus = program(VS_LOTUS, FS_LOTUS, ["aCorner", "aP", "aQ"]);
  P.pts = program(VS_PTS, FS_PTS, ["aP"]);
  const mk = () => gl.createBuffer();
  B = { quad: mk(), fish: mk(), padInst: mk(), lotusInst: mk(), petalInst: mk(), specks: mk(), motes: mk(), bubbles: mk() };
  gl.bindBuffer(gl.ARRAY_BUFFER, B.quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, B.fish);
  gl.bufferData(gl.ARRAY_BUFFER, fishData.byteLength, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, B.bubbles);
  gl.bufferData(gl.ARRAY_BUFFER, BUB.byteLength, gl.DYNAMIC_DRAW);
  B.fishVAO = vao(() => { attr(B.fish, 0, 2, 24, 0); attr(B.fish, 1, 2, 24, 8); attr(B.fish, 2, 2, 24, 16); });
  const inst = (buf) => vao(() => { attr(B.quad, 0, 2, 8, 0); attr(buf, 1, 4, 32, 0, 1); attr(buf, 2, 4, 32, 16, 1); });
  B.padVAO = inst(B.padInst); B.lotusVAO = inst(B.lotusInst); B.petalVAO = inst(B.petalInst);
  B.specksVAO = vao(() => attr(B.specks, 0, 4, 16, 0));
  B.motesVAO = vao(() => attr(B.motes, 0, 4, 16, 0));
  B.bubblesVAO = vao(() => attr(B.bubbles, 0, 4, 16, 0));
  resize(true);
}

function resize(force) {
  if (!gl || lost) return;
  const dpr = window.devicePixelRatio || 1;
  const nw = Math.max(2, Math.round(innerWidth * dpr)), nh = Math.max(2, Math.round(innerHeight * dpr));
  const pr = PRESETS[S.quality];
  const sc = Math.min(1, Math.sqrt(pr.px * resScale / (nw * nh)));
  const w = Math.max(2, Math.round(nw * sc)), h = Math.max(2, Math.round(nh * sc));
  const aspect = nw / nh;
  const bs = Math.min(1, Math.sqrt(pr.bed / (nw * nh)));
  const key = [Math.round(nw * bs), Math.round(nh * bs), pr.sim, aspect.toFixed(4)].join("x");
  if (key !== bedKey) {
    bedKey = key;
    A = aspect;
    bedW = Math.round(nw * bs); bedH = Math.round(nh * bs);
    simH = pr.sim; simW = Math.round(pr.sim * A);
    drop(["bedA", "veg", "info", "bedF", "sim0", "sim1", "simF0", "simF1"]);
    T.bedA = makeTex(bedW, bedH, false); T.veg = makeTex(bedW, bedH, false); T.info = makeTex(bedW, bedH, false);
    T.bedF = makeFBO([T.bedA, T.veg, T.info]);
    T.sim0 = makeTex(simW, simH, true); T.sim1 = makeTex(simW, simH, true);
    T.simF0 = makeFBO([T.sim0]); T.simF1 = makeFBO([T.sim1]);
    gl.clearColor(0, 0, 0, 0);
    for (const f of [T.simF0, T.simF1]) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clear(gl.COLOR_BUFFER_BIT); }
    bakeBed();
    layout();
    uploadScene();
    for (const f of fish) if (danger(f.x, f.y) > .5) { f.x = A * .6; f.y = .5; }
    force = true;
  }
  if (force || w !== W || h !== H) {
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    cW = Math.max(2, Math.round(W * pr.cs)); cH = Math.max(2, Math.round(H * pr.cs));
    sW = Math.max(2, Math.round(W * pr.sh)); sH = Math.max(2, Math.round(H * pr.sh));
    drop(["caus", "surf", "causF", "shadow", "shadowF", "fish", "fishF"]);
    T.caus = makeTex(cW, cH, true); T.surf = makeTex(cW, cH, true); T.causF = makeFBO([T.caus, T.surf]);
    T.shadow = makeTex(sW, sH, false); T.shadowF = makeFBO([T.shadow]);
    T.fish = makeTex(W, H, true); T.fishF = makeFBO([T.fish]);
  }
}

// baked in horizontal strips so no single draw is long enough to trip the GPU watchdog
function bakeBed() {
  const p = P.bed;
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.bedF);
  gl.viewport(0, 0, bedW, bedH);
  use(p, bedW, bedH);
  gl.enable(gl.SCISSOR_TEST);
  const strips = Math.max(4, Math.ceil(bedW * bedH / 4e5));
  for (let i = 0; i < strips; i++) {
    const y0 = Math.floor(bedH * i / strips), y1 = Math.floor(bedH * (i + 1) / strips);
    gl.scissor(0, y0, bedW, y1 - y0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.flush();
  }
  gl.disable(gl.SCISSOR_TEST);
}

/* ======================================================================================
 * Frame loop, pausing, adaptive resolution, host hooks
 * ==================================================================================== */
let running = true, raf = 0, last = 0, onBattery = false, gapSum = 0, frames = 0, calmFrames = 0;
const stats = { n: 0, t0: 0, fps: 0 };
window.__lwStats = () => ({ fps: Math.round(stats.fps), size: [W, H], resScale: +resScale.toFixed(2), quality: S.quality, hdr: HDR });
function targetFps() { const f = S.fps || PRESETS[S.quality].fps; return onBattery ? Math.min(f, 30) : f; }
function frame(ts) {
  raf = 0;
  if (!running || lost) return;
  raf = requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const target = 1000 / targetFps();
  const gap = last ? ts - last : target;
  if (last && gap < target - 1.5) return;
  last = ts;
  const dt = Math.min(.1, gap / 1000);
  step(dt);
  render();
  stats.n++;
  if (ts - stats.t0 >= 1000) { stats.fps = stats.n * 1000 / (ts - stats.t0); stats.n = 0; stats.t0 = ts; }
  // the GPU can't keep up when frames keep arriving late: drop internal resolution a step
  gapSum += gap;
  if (++frames >= 90) {
    const avg = gapSum / frames;
    if (avg > target * 1.35 && resScale > .45) { resScale *= .85; resize(); calmFrames = 0; }
    else if (avg < target * 1.08 && resScale < 1 && ++calmFrames > 8) { resScale = Math.min(1, resScale * 1.1); resize(); calmFrames = 0; }
    frames = 0; gapSum = 0;
  }
}
function setPaused(p) {
  running = !p;
  last = 0;
  if (running && !raf && !STILL) raf = requestAnimationFrame(frame);
}
function setQuality(q) { if (!PRESETS[q] || q === S.quality) return; S.quality = q; resScale = 1; resize(true); }

function setIcons(d) {
  if (!d || d.demo || !Array.isArray(d.r)) { iconRects = null; return; }
  if (d.vis === false) { iconRects = []; return; }
  const k = (innerWidth / (d.sw > 0 ? d.sw : innerWidth)) / innerHeight;   // physical px -> world units
  const m = .03;
  iconRects = d.r.map(([x, y, w, h]) => [x * k - m, y * k - m, (x + w) * k + m, (y + h) * k + m]);
}

function fail(e) {
  console.error("Koi Pond:", e);
  document.body.style.background = "radial-gradient(ellipse at 70% 40%, #1d7a72, #0a3d3c 55%, #04201f)";
  canvas.style.display = "none";
}
canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); lost = true; });
canvas.addEventListener("webglcontextrestored", () => { lost = false; try { init(); setPaused(!running); } catch (e) { fail(e); } });
document.addEventListener("visibilitychange", () => { last = 0; });
let resizeQueued = false;
addEventListener("resize", () => { if (resizeQueued) return; resizeQueued = true; requestAnimationFrame(() => { resizeQueued = false; resize(); if (STILL) render(); }); });
if (navigator.getBattery) navigator.getBattery().then((b) => { const u = () => { onBattery = !b.charging; }; b.addEventListener("chargingchange", u); u(); }).catch(() => {});

window.__lwIcons = setIcons;
window.__lwSettings = (o) => {
  if (!o) return;
  if (o.fps) S.fps = clamp(+o.fps, 10, 240);
  if (o.quality) setQuality(o.quality);
  if (o.fish) setFishCount(+o.fish);
  if ("lotus" in o) S.lotus = !!o.lotus;
  if ("calm" in o) S.calm = !!o.calm;
  if (o.paused != null) setPaused(!!o.paused);
};
window.livelyPropertyListener = (name, val) => {
  if (name === "quality") setQuality(["low", "medium", "high", "ultra"][val] || "high");
  else if (name === "fps") S.fps = clamp(+val, 10, 240);
  else if (name === "koi") setFishCount(+val);
  else if (name === "lotus") S.lotus = !!val;
  else if (name === "calmLeft") S.calm = !!val;
};
window.livelyWallpaperPlaybackChanged = (data) => {
  try { const o = typeof data === "string" ? JSON.parse(data) : data; setPaused(!!o.IsPaused); } catch (e) { /* ignore */ }
};

try {
  init();
  setFishCount(S.fish);
  if (location.protocol.startsWith("http")) {
    fetch("/__icons", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then(setIcons).catch(() => {});
  }
  if (STILL) {
    const t0 = time || 24;
    time = 0;
    for (let i = 0, n = Math.round(t0 * 30); i < n; i++) step(1 / 30);
    render();
  } else {
    for (let i = 0; i < 90; i++) step(1 / 30);   // settle the ripples and the swimmers before the first frame
    raf = requestAnimationFrame(frame);
  }
} catch (e) { fail(e); }
})();
</script></body></html>
