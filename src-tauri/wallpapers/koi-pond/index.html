<!doctype html>
<html><head><meta charset="utf-8"><title>Koi Pond</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#062a2b}
canvas{display:block;width:100vw;height:100vh}
</style></head>
<body><canvas id="c"></canvas>
<!--
  Koi Pond: a sunlit Japanese garden pond seen from above. Raw WebGL2, no libraries, no image assets.
  See README.md in this folder for the full module map, the frame pipeline and the settings contract.

  The code is split into plain (classic) scripts that share one global scope, so it also runs from
  file:// (Lively, double-clicking index.html) where ES modules would be blocked. ORDER MATTERS:
  each file may use what the files above it define. Every file starts with a header listing what it
  "Defines" and what it "Uses".

  Options: ?q=low|medium|high|ultra  ?fps=60  ?fish=8  ?t=seconds  ?still (render one settled frame)  ?debug
  Host:    window.__lwSettings({ quality, fps, fish, lotus, calm, paused }), window.__lwIcons(snapshot),
           window.__lwClick(x, y)  a click on the water (0..1 of the screen): sprinkles food
  Lively / Customize panel: livelyPropertyListener(name, value) with the names in LivelyProperties.json,
           livelyWallpaperPlaybackChanged(json); saved values arrive early as window.__lwProps
-->

<!-- 1. settings -->
<script src="js/config.js"></script>

<!-- 2. GLSL sources (just strings; compiled in setup.js) -->
<script src="js/shaders/common.js"></script>
<script src="js/shaders/bed.js"></script>
<script src="js/shaders/water.js"></script>
<script src="js/shaders/koi.js"></script>
<script src="js/shaders/composite.js"></script>
<script src="js/shaders/lily-pads.js"></script>
<script src="js/shaders/lotus.js"></script>
<script src="js/shaders/points.js"></script>

<!-- 3. world, GL helpers, scene -->
<script src="js/world.js"></script>
<script src="js/gl.js"></script>
<script src="js/scene.js"></script>

<!-- 4. koi, feeding, simulation, rendering -->
<script src="js/koi.js"></script>
<script src="js/food.js"></script>
<script src="js/koi-mesh.js"></script>
<script src="js/simulation.js"></script>
<script src="js/render.js"></script>

<!-- 5. setup, frame loop, host hooks, boot (main.js must stay last) -->
<script src="js/setup.js"></script>
<script src="js/loop.js"></script>
<script src="js/host.js"></script>
<script src="js/main.js"></script>
</body></html>
